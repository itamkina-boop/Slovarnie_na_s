<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Кот-жемчуголов • Словарные слова</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #0a1a2a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            touch-action: none;
        }

        .game-container {
            position: relative;
            width: 100%;
            max-width: 1200px;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        #gameCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
        }

        .top-panel {
            position: absolute;
            top: 16px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            z-index: 20;
            pointer-events: none;
        }

        .lives-container {
            display: flex;
            gap: 8px;
            background: rgba(10, 30, 40, 0.6);
            backdrop-filter: blur(4px);
            padding: 8px 16px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .life-icon {
            width: 30px;
            height: 30px;
            object-fit: contain;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
            transition: all 0.3s ease;
        }

        .life-icon.lost {
            opacity: 0.3;
            filter: grayscale(1);
        }

        .score-container {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(10, 30, 40, 0.6);
            backdrop-filter: blur(4px);
            padding: 8px 16px 8px 12px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .score-pearl {
            width: 28px;
            height: 28px;
            object-fit: contain;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
        }

        .score-count {
            color: white;
            font-size: 24px;
            font-weight: 700;
            text-shadow: 0 2px 5px rgba(0,0,0,0.7);
            min-width: 30px;
            text-align: center;
        }

        .vowel-keyboard {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
            padding: 16px 20px;
            background: rgba(0, 30, 50, 0.75);
            backdrop-filter: blur(8px);
            border-top: 2px solid rgba(255, 255, 255, 0.15);
            z-index: 30;
            transform: translateY(100%);
            transition: transform 0.3s ease;
        }

        .vowel-keyboard.show {
            transform: translateY(0);
        }

        .vowel-btn {
            width: 60px;
            height: 60px;
            border-radius: 40px;
            background: linear-gradient(145deg, #2b6c8f, #1a4b6b);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: white;
            font-size: 32px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 6px 0 #0e2a3a, 0 8px 15px rgba(0,0,0,0.4);
            transition: all 0.05s ease;
            touch-action: manipulation;
        }

        .vowel-btn:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 #0e2a3a, 0 5px 12px rgba(0,0,0,0.4);
            background: linear-gradient(145deg, #1f5a7a, #123b52);
        }

        .vowel-btn.error {
            background: linear-gradient(145deg, #8f2b2b, #6b1a1a);
            animation: shake 0.3s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        @media (min-width: 1024px) {
            .vowel-keyboard {
                display: none;
            }
        }

        @media (max-width: 1023px) and (min-width: 768px) {
            .vowel-btn {
                width: 70px;
                height: 70px;
                font-size: 36px;
            }
        }

        @media (max-width: 600px) {
            .vowel-btn {
                width: 48px;
                height: 48px;
                font-size: 28px;
            }
            
            .top-panel {
                padding: 0 12px;
            }
            
            .lives-container {
                padding: 5px 10px;
            }
            
            .life-icon {
                width: 22px;
                height: 22px;
            }
            
            .score-container {
                padding: 5px 12px 5px 8px;
            }
            
            .score-pearl {
                width: 22px;
                height: 22px;
            }
            
            .score-count {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <canvas id="gameCanvas"></canvas>
        
        <div class="top-panel">
            <div class="lives-container" id="livesContainer">
                <img src="cat_swim.png" class="life-icon" id="life1" alt="жизнь">
                <img src="cat_swim.png" class="life-icon" id="life2" alt="жизнь">
                <img src="cat_swim.png" class="life-icon" id="life3" alt="жизнь">
            </div>
            
            <div class="score-container">
                <img src="pearl_idle.png" class="score-pearl" alt="жемчужина">
                <span class="score-count" id="scoreCount">0</span>
            </div>
        </div>
        
        <div class="vowel-keyboard" id="vowelKeyboard">
            <button class="vowel-btn" data-letter="а">А</button>
            <button class="vowel-btn" data-letter="е">Е</button>
            <button class="vowel-btn" data-letter="ё">Ё</button>
            <button class="vowel-btn" data-letter="и">И</button>
            <button class="vowel-btn" data-letter="о">О</button>
            <button class="vowel-btn" data-letter="у">У</button>
            <button class="vowel-btn" data-letter="ы">Ы</button>
            <button class="vowel-btn" data-letter="э">Э</button>
            <button class="vowel-btn" data-letter="ю">Ю</button>
            <button class="vowel-btn" data-letter="я">Я</button>
        </div>
    </div>

    <script>
        (function() {
            // ==================== НАСТРОЙКИ ====================
            const SETTINGS = {
                CAT_SIZE: 80,
                PEARL_SIZE: 50,
                CAT_SPEED: 0.08,
                SINK_SPEED: 0.15,        // Уменьшил скорость погружения для плавности
                SINK_DELAY: 2000,          // Задержка перед началом погружения (2 секунды)
                BUBBLE_COUNT: 20,
                MAX_LIVES: 3
            };

            // ==================== СЛОВАРНЫЕ СЛОВА ====================
            const WORDS = [
                { word: "салют", mask: "с_лют", missing: ["а"] },
                { word: "салютовать", mask: "с_лютовать", missing: ["а"] },
                { word: "сатира", mask: "с_тира", missing: ["а"] },
                { word: "сатирический", mask: "с_тирический", missing: ["а"] },
                { word: "сварливый", mask: "св_рливый", missing: ["а"] },
                { word: "свидетель", mask: "св_детель", missing: ["и"] },
                { word: "сезон", mask: "с_зон", missing: ["е"] },
                { word: "сезонный", mask: "с_зонный", missing: ["е"] },
                { word: "симпатия", mask: "с_мпатия", missing: ["и"] },
                { word: "симпатичный", mask: "с_мпатичный", missing: ["и"] },
                { word: "симптом", mask: "с_мптом", missing: ["и"] },
                { word: "симфония", mask: "с_мфония", missing: ["и"] },
                { word: "симфонический", mask: "с_мфонический", missing: ["и"] },
                { word: "синхронный", mask: "с_нхронный", missing: ["и"] },
                { word: "сирень", mask: "с_рень", missing: ["и"] },
                { word: "сиреневый", mask: "с_реневый", missing: ["и"] },
                { word: "система", mask: "с_стема", missing: ["и"] },
                { word: "систематичный", mask: "с_стематичный", missing: ["и"] },
                { word: "систематизировать", mask: "с_стематизировать", missing: ["и"] },
                { word: "смятение", mask: "см_тение", missing: ["я"] },
                { word: "снарядить", mask: "сн_рядить", missing: ["а"] },
                { word: "снаряжение", mask: "сн_ряжение", missing: ["а"] },
                { word: "сокровенный", mask: "с_кр_венный", missing: ["о", "о"] },
                { word: "сонет", mask: "с_нет", missing: ["о"] },
                { word: "сострадать", mask: "состр_дать", missing: ["а"] },
                { word: "сострадание", mask: "состр_дание", missing: ["а"] },
                { word: "состязаться", mask: "сост_заться", missing: ["я"] },
                { word: "состязание", mask: "сост_зание", missing: ["я"] },
                { word: "социальный", mask: "соц_альный", missing: ["и"] },
                { word: "спартакиада", mask: "сп_ртакиада", missing: ["а"] },
                { word: "спокойный", mask: "сп_койный", missing: ["о"] },
                { word: "стадион", mask: "ст_дион", missing: ["а"] },
                { word: "стипендия", mask: "ст_пендия", missing: ["и"] },
                { word: "страховать", mask: "стр_ховать", missing: ["а"] },
                { word: "страховка", mask: "стр_ховка", missing: ["а"] },
                { word: "стремиться", mask: "стр_миться", missing: ["е"] },
                { word: "стремление", mask: "стр_мление", missing: ["е"] },
                { word: "суверенитет", mask: "сув_р_н_тет", missing: ["е", "е", "и"] },
                { word: "суверенный", mask: "сув_ренный", missing: ["е"] },
                { word: "сувенир", mask: "сув_нир", missing: ["е"] }
            ];

            // ==================== АФФИРМАЦИИ ====================
            const PRAISES = [
                "Так держать, капитан!", "Грамота — сила!", "Ну ты красавчик!",
                "В самую точку!", "Мощный взрыв мозга!", "Жемчужина твоя!",
                "Очередная победа!", "Так и до отличника недалеко!",
                "Глубокая мысль!", "Легко, как пузырьки!",
                "Океан знаний покоряется!", "Кот одобряет!"
            ];

            // ==================== СОСТОЯНИЕ ИГРЫ ====================
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const scoreElement = document.getElementById('scoreCount');
            const vowelKeyboard = document.getElementById('vowelKeyboard');
            const lifeIcons = [
                document.getElementById('life1'),
                document.getElementById('life2'),
                document.getElementById('life3')
            ];
            
            const images = { cat: null, bg: null, pearl: null };
            let loadedCount = 0;

            let cat = { x: 400, y: 300 };
            let targetX = 400, targetY = 300;
            let lastMoveTime = Date.now();
            let isSinking = false;
            let sinkDepth = 0; // Для плавного увеличения наклона при погружении

            let pearls = [];
            let score = 0;
            let lives = SETTINGS.MAX_LIVES;

            let activeWord = null;
            let currentMissingIndex = 0;
            let userAnswers = [];

            let bubbles = [];

            let affirmation = { text: '', visible: false, timer: 0 };
            
            // Анимационные эффекты
            let collectAnimations = [];

            // ==================== ЗАГРУЗКА КАРТИНОК ====================
            function loadImages() {
                images.cat = new Image();
                images.cat.src = 'cat_swim.png';
                images.cat.onload = imageLoaded;
                images.cat.onerror = imageLoaded;

                images.bg = new Image();
                images.bg.src = 'background_ocean.PNG';
                images.bg.onload = imageLoaded;
                images.bg.onerror = imageLoaded;

                images.pearl = new Image();
                images.pearl.src = 'pearl_idle.png';
                images.pearl.onload = imageLoaded;
                images.pearl.onerror = imageLoaded;
            }

            function imageLoaded() {
                loadedCount++;
                if (loadedCount === 3) {
                    initGame();
                }
            }

            // ==================== ИНИЦИАЛИЗАЦИЯ ====================
            function initGame() {
                for (let i = 0; i < 12; i++) {
                    spawnPearl();
                }
                
                for (let i = 0; i < SETTINGS.BUBBLE_COUNT; i++) {
                    bubbles.push({
                        x: Math.random() * canvas.width,
                        y: Math.random() * canvas.height,
                        size: 3 + Math.random() * 8,
                        speed: 0.5 + Math.random() * 1.5
                    });
                }
                
                updateScore();
                updateLivesDisplay();
                requestAnimationFrame(gameLoop);
            }

            function spawnPearl() {
                const margin = 60;
                pearls.push({
                    x: margin + Math.random() * (canvas.width - margin * 2),
                    y: margin + Math.random() * (canvas.height * 0.7 - margin),
                    vy: (Math.random() - 0.5) * 0.3,
                    phase: Math.random() * Math.PI * 2,
                    scale: 1,
                    collecting: false,
                    pulseTime: 0
                });
            }

            function updateScore() {
                scoreElement.textContent = score;
            }

            function updateLivesDisplay() {
                lifeIcons.forEach((icon, index) => {
                    if (index < lives) {
                        icon.classList.remove('lost');
                    } else {
                        icon.classList.add('lost');
                    }
                });
            }

            function showAffirmation() {
                affirmation.text = PRAISES[Math.floor(Math.random() * PRAISES.length)];
                affirmation.visible = true;
                affirmation.timer = 120;
            }

            function gameOver() {
                alert('Игра окончена! Кот утонул... Нажмите ОК для перезапуска.');
                resetGame();
            }

            function resetGame() {
                lives = SETTINGS.MAX_LIVES;
                score = 0;
                updateScore();
                updateLivesDisplay();
                
                cat.x = canvas.width / 2;
                cat.y = canvas.height / 2;
                targetX = cat.x;
                targetY = cat.y;
                isSinking = false;
                sinkDepth = 0;
                lastMoveTime = Date.now();
                
                pearls = [];
                for (let i = 0; i < 12; i++) {
                    spawnPearl();
                }
                
                closeWord();
            }

            function loseLife() {
                lives--;
                updateLivesDisplay();
                
                // Анимация потери жизни
                if (lives >= 0) {
                    lifeIcons[lives].style.transform = 'scale(0.8)';
                    setTimeout(() => {
                        if (lifeIcons[lives]) {
                            lifeIcons[lives].style.transform = 'scale(1)';
                        }
                    }, 200);
                }
                
                if (lives <= 0) {
                    gameOver();
                }
            }

            function openWord(wordData) {
                activeWord = { ...wordData };
                currentMissingIndex = 0;
                userAnswers = [];
                
                if (window.innerWidth < 1024) {
                    vowelKeyboard.classList.add('show');
                }
            }

            function closeWord() {
                activeWord = null;
                vowelKeyboard.classList.remove('show');
                
                // Убираем класс ошибки со всех кнопок
                document.querySelectorAll('.vowel-btn').forEach(btn => {
                    btn.classList.remove('error');
                });
            }

            function checkLetter(letter) {
                if (!activeWord) return false;
                
                const expected = activeWord.missing[currentMissingIndex];
                if (letter === expected) {
                    userAnswers.push(letter);
                    currentMissingIndex++;
                    
                    if (currentMissingIndex >= activeWord.missing.length) {
                        score++;
                        updateScore();
                        showAffirmation();
                        closeWord();
                    }
                    return true;
                } else {
                    // Неправильная буква - теряем жизнь
                    loseLife();
                    
                    // Визуальная обратная связь
                    const btn = document.querySelector(`[data-letter="${letter}"]`);
                    if (btn) {
                        btn.classList.add('error');
                        setTimeout(() => btn.classList.remove('error'), 300);
                    }
                    
                    return false;
                }
            }

            function handleInput(x, y) {
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;
                
                targetX = (x - rect.left) * scaleX;
                targetY = (y - rect.top) * scaleY;
                
                // Ограничиваем, чтобы кот не уходил слишком глубоко
                targetY = Math.min(targetY, canvas.height - 100);
                targetY = Math.max(targetY, 50); // Не даем выплыть слишком высоко
                
                lastMoveTime = Date.now();
                isSinking = false;
                sinkDepth = 0; // Сбрасываем наклон при движении
            }

            // ==================== ОБРАБОТЧИКИ ====================
            canvas.addEventListener('mousemove', (e) => {
                handleInput(e.clientX, e.clientY);
            });
            
            canvas.addEventListener('touchmove', (e) => {
                e.preventDefault();
                const touch = e.touches[0];
                handleInput(touch.clientX, touch.clientY);
            }, { passive: false });
            
            canvas.addEventListener('touchstart', (e) => {
                e.preventDefault();
                const touch = e.touches[0];
                handleInput(touch.clientX, touch.clientY);
            }, { passive: false });

            window.addEventListener('keydown', (e) => {
                if (!activeWord) return;
                const letter = e.key.toLowerCase();
                if ('аеёиоуыэюя'.includes(letter)) {
                    checkLetter(letter);
                }
            });

            document.querySelectorAll('.vowel-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    if (!activeWord) return;
                    checkLetter(btn.dataset.letter);
                });
                
                btn.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    if (!activeWord) return;
                    checkLetter(btn.dataset.letter);
                });
            });

            // ==================== ОБНОВЛЕНИЕ ====================
            function update() {
                // Движение кота к цели
                cat.x += (targetX - cat.x) * SETTINGS.CAT_SPEED;
                cat.y += (targetY - cat.y) * SETTINGS.CAT_SPEED;
                
                // Проверка на бездействие - плавное погружение
                const timeSinceLastMove = Date.now() - lastMoveTime;
                if (timeSinceLastMove > SETTINGS.SINK_DELAY) {
                    isSinking = true;
                    
                    // Плавно увеличиваем наклон при погружении
                    sinkDepth = Math.min(sinkDepth + 0.02, 0.3);
                    
                    // Плавно опускаем кота вниз
                    cat.y += SETTINGS.SINK_SPEED * (1 + sinkDepth); // Чем глубже, тем быстрее
                    
                    // Ограничиваем, чтобы кот не ушел за пределы экрана
                    if (cat.y > canvas.height - 40) {
                        cat.y = canvas.height - 40;
                    }
                } else {
                    isSinking = false;
                    sinkDepth = Math.max(sinkDepth - 0.02, 0); // Плавно выпрямляем
                }
                
                // Обновление жемчужин
                pearls.forEach(p => {
                    p.phase += 0.02;
                    p.y += Math.sin(p.phase) * 0.1 + (p.vy || 0);
                    if (p.y > canvas.height - 100) p.y = canvas.height - 100;
                    if (p.y < 40) p.y = 40;
                    
                    // Пульсация
                    p.pulseTime = (p.pulseTime || 0) + 1;
                });
                
                // Проверка столкновений с жемчужинами
                if (!activeWord && lives > 0) {
                    for (let i = pearls.length - 1; i >= 0; i--) {
                        const p = pearls[i];
                        if (p.collecting) continue;
                        
                        const dx = cat.x - p.x;
                        const dy = cat.y - p.y;
                        const dist = Math.sqrt(dx*dx + dy*dy);
                        
                        if (dist < SETTINGS.CAT_SIZE/2 + SETTINGS.PEARL_SIZE/2) {
                            // Добавляем анимацию сбора
                            collectAnimations.push({
                                x: p.x,
                                y: p.y,
                                scale: 1,
                                alpha: 1,
                                timer: 30
                            });
                            
                            p.collecting = true;
                            const wordIndex = Math.floor(Math.random() * WORDS.length);
                            openWord(WORDS[wordIndex]);
                            pearls.splice(i, 1);
                            spawnPearl();
                            break;
                        }
                    }
                }
                
                // Обновление анимаций сбора
                collectAnimations = collectAnimations.filter(anim => {
                    anim.timer--;
                    anim.scale = 1 + (30 - anim.timer) * 0.03;
                    anim.alpha = anim.timer / 30;
                    return anim.timer > 0;
                });
                
                // Обновление аффирмации
                if (affirmation.timer > 0) {
                    affirmation.timer--;
                } else {
                    affirmation.visible = false;
                }
                
                // Обновление пузырьков
                bubbles.forEach(b => {
                    b.y -= b.speed;
                    if (b.y < -20) {
                        b.y = canvas.height + 20;
                        b.x = Math.random() * canvas.width;
                    }
                });
            }

            // ==================== ОТРИСОВКА ====================
            function draw() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                // Фон
                if (images.bg.complete) {
                    ctx.drawImage(images.bg, 0, 0, canvas.width, canvas.height);
                } else {
                    ctx.fillStyle = '#0a3847';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                }
                
                // Пузырьки
                ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
                bubbles.forEach(b => {
                    ctx.beginPath();
                    ctx.arc(b.x, b.y, b.size, 0, Math.PI * 2);
                    ctx.fill();
                });
                
                // Жемчужины
                pearls.forEach(p => {
                    if (p.collecting) return;
                    
                    ctx.save();
                    ctx.translate(p.x, p.y);
                    
                    // Эффект пульсации
                    const pulse = Math.sin(p.pulseTime * 0.1) * 0.05 + 1;
                    ctx.scale(pulse, pulse);
                    
                    ctx.rotate(Math.sin(p.phase) * 0.05);
                    
                    if (images.pearl.complete) {
                        ctx.drawImage(images.pearl, -SETTINGS.PEARL_SIZE/2, -SETTINGS.PEARL_SIZE/2, 
                                     SETTINGS.PEARL_SIZE, SETTINGS.PEARL_SIZE);
                    } else {
                        ctx.fillStyle = '#fff0d0';
                        ctx.beginPath();
                        ctx.arc(0, 0, SETTINGS.PEARL_SIZE/2, 0, Math.PI*2);
                        ctx.fill();
                    }
                    
                    ctx.restore();
                });
                
                // Анимации сбора жемчужин
                collectAnimations.forEach(anim => {
                    ctx.save();
                    ctx.translate(anim.x, anim.y);
                    ctx.globalAlpha = anim.alpha;
                    ctx.scale(anim.scale, anim.scale);
                    
                    // Рисуем увеличивающуюся и исчезающую жемчужину
                    if (images.pearl.complete) {
                        ctx.drawImage(images.pearl, -SETTINGS.PEARL_SIZE/2, -SETTINGS.PEARL_SIZE/2, 
                                     SETTINGS.PEARL_SIZE, SETTINGS.PEARL_SIZE);
                    }
                    
                    // Добавляем звездочки
                    ctx.fillStyle = '#ffd700';
                    ctx.globalAlpha = anim.alpha * 0.8;
                    for (let i = 0; i < 4; i++) {
                        const angle = (i * Math.PI/2) + anim.timer * 0.1;
                        const dx = Math.cos(angle) * 20;
                        const dy = Math.sin(angle) * 20;
                        ctx.beginPath();
                        ctx.arc(dx, dy, 3, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    
                    ctx.restore();
                });
                
                // Кот с эффектом погружения
                ctx.save();
                ctx.translate(cat.x, cat.y);
                
                // Плавный наклон при погружении
                if (isSinking) {
                    ctx.rotate(0.1 + sinkDepth * 0.5); // Увеличиваем наклон с глубиной
                    ctx.globalAlpha = 1 - sinkDepth * 0.3; // Становится чуть прозрачнее с глубиной
                }
                
                if (images.cat.complete) {
                    ctx.drawImage(images.cat, -SETTINGS.CAT_SIZE/2, -SETTINGS.CAT_SIZE/2,
                                 SETTINGS.CAT_SIZE, SETTINGS.CAT_SIZE);
                } else {
                    ctx.fillStyle = 'orange';
                    ctx.beginPath();
                    ctx.arc(0, 0, SETTINGS.CAT_SIZE/2, 0, Math.PI*2);
                    ctx.fill();
                }
                ctx.restore();
                
                // Окно с заданием
                if (activeWord) {
                    ctx.fillStyle = 'rgba(0, 20, 30, 0.85)';
                    ctx.shadowColor = 'rgba(0,0,0,0.5)';
                    ctx.shadowBlur = 20;
                    ctx.beginPath();
                    roundRect(ctx, canvas.width/2 - 200, canvas.height/2 - 60, 400, 100, 30);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    
                    ctx.font = 'bold 40px "Segoe UI", Roboto, sans-serif';
                    ctx.fillStyle = '#ffffff';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    
                    let displayWord = activeWord.mask;
                    for (let i = 0; i < userAnswers.length; i++) {
                        displayWord = displayWord.replace('_', userAnswers[i]);
                    }
                    
                    ctx.fillText(displayWord, canvas.width/2, canvas.height/2);
                    
                    ctx.font = '16px sans-serif';
                    ctx.fillStyle = '#8ab3cf';
                    ctx.fillText('Вставь гласную', canvas.width/2, canvas.height/2 + 45);
                    
                    // Индикатор прогресса
                    const progress = userAnswers.length / activeWord.missing.length;
                    ctx.fillStyle = '#4caf50';
                    ctx.fillRect(canvas.width/2 - 100, canvas.height/2 + 50, 200 * progress, 5);
                }
                
                // Аффирмация
                if (affirmation.visible) {
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
                    ctx.shadowBlur = 15;
                    ctx.beginPath();
                    roundRect(ctx, canvas.width/2 - 180, 100, 360, 60, 40);
                    ctx.fill();
                    
                    ctx.shadowBlur = 0;
                    ctx.font = 'bold 24px sans-serif';
                    ctx.fillStyle = '#ffd966';
                    ctx.fillText(affirmation.text, canvas.width/2, 135);
                }
            }

            function roundRect(ctx, x, y, w, h, r) {
                if (w < 2 * r) r = w / 2;
                if (h < 2 * r) r = h / 2;
                ctx.moveTo(x + r, y);
                ctx.lineTo(x + w - r, y);
                ctx.quadraticCurveTo(x + w, y, x + w, y + r);
                ctx.lineTo(x + w, y + h - r);
                ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
                ctx.lineTo(x + r, y + h);
                ctx.quadraticCurveTo(x, y + h, x, y + h - r);
                ctx.lineTo(x, y + r);
                ctx.quadraticCurveTo(x, y, x + r, y);
            }

            function gameLoop() {
                if (lives > 0) {
                    update();
                }
                draw();
                requestAnimationFrame(gameLoop);
            }

            // ==================== РАЗМЕР CANVAS ====================
            function resizeCanvas() {
                const container = canvas.parentElement;
                canvas.width = container.clientWidth;
                canvas.height = container.clientHeight;
                
                if (cat.x === 400 && cat.y === 300) {
                    cat.x = canvas.width / 2;
                    cat.y = canvas.height / 2;
                    targetX = cat.x;
                    targetY = cat.y;
                }
            }

            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();
            loadImages();
        })();
    </script>
</body>
